<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Body Army</title>
<style>
  :root {
    --bg:#0e1016; --panel:#171a24; --panel-2:#1f2330; --text:#e7ebf3;
    --muted:#8b93a7; --good:#46d39a; --bad:#ff6b6b; --army:#5aa9ff; --line:#2a2f3d;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%, #1a2030, var(--bg));
    color:var(--text); min-height:100vh; }

  header { padding:22px 20px 4px; text-align:center; }
  header h1 { font-size:24px; letter-spacing:.4px; }
  header p  { margin-top:5px; color:var(--muted); font-size:13px; }

  .wrap { max-width:1160px; margin:0 auto; padding:14px 16px 60px;
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; align-items:start; }
  @media(max-width:900px){ .wrap{ grid-template-columns:1fr 1fr; } }
  @media(max-width:560px){ .wrap{ grid-template-columns:1fr; } }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .panel-title { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:12px; }

  /* ── Body image ── */
  .bodyWrap { position:relative; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); background:var(--bg); height:500px; }
  .bodyWrap img { position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; object-position:center top; }
  #bodyFlash { position:absolute; inset:0; pointer-events:none; opacity:0;
    border-radius:12px; transition:opacity .1s; z-index:3; }

  .score-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px; }
  .score-block { flex:1; }
  .score-label { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .score-bar { height:7px; border-radius:5px; background:#11141d; overflow:hidden; border:1px solid var(--line); }
  .score-bar span { display:block; height:100%; transition:width .5s, background .5s; border-radius:5px; }
  .score-num { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* ── Tabs ── */
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn { flex:1; padding:8px 6px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); cursor:pointer; font-size:13px;
    font-weight:600; transition:all .15s; }
  .tab-btn.active { background:#1e2d4a; color:var(--army); border-color:#2a4a7a; }

  /* ── Units ── */
  .units { display:flex; flex-direction:column; gap:9px; }
  .unit { background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; transition:background .4s; }
  .unit-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .unit-left { display:flex; align-items:center; gap:8px; }
  .unit-emoji { font-size:17px; line-height:1; }
  .unit-name  { font-size:13px; font-weight:600; }
  .unit-desc  { font-size:11px; color:var(--muted); margin-top:1px; }
  .unit-val   { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:26px; text-align:right; }
  .unit-bar   { height:7px; border-radius:5px; background:#11141d; overflow:hidden; border:1px solid var(--line); }
  .unit-bar span { display:block; height:100%; transition:width .5s; border-radius:5px; }

  /* ── Input + log ── */
  .inputRow { display:flex; gap:8px; }
  .inputRow input { flex:1; background:var(--panel-2); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; color:var(--text); font-size:15px; }
  .inputRow input:focus { outline:none; border-color:#3a4a66; }
  .inputRow button { background:linear-gradient(90deg,#3d7fd6,var(--army)); border:none;
    color:#fff; font-weight:600; padding:0 16px; border-radius:12px; cursor:pointer; font-size:15px; }
  .chips { margin-top:10px; display:flex; flex-wrap:wrap; gap:7px; }
  .chips button { background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:6px 11px; font-size:12px; cursor:pointer; }
  .chips button:hover { color:var(--text); border-color:#3a4a66; }

  .log { margin-top:6px; max-height:300px; overflow:auto; font-size:13px; }
  .log-entry { padding:8px 6px; border-bottom:1px solid var(--line); color:var(--muted); }
  .log-entry b { color:var(--text); }
  .changes { float:right; font-size:11px; line-height:1.7; text-align:right; max-width:130px; margin-left:8px; }
  .up { color:var(--good); } .dn { color:var(--bad); }
  .sci { font-size:11px; color:#5a6480; margin-top:3px; }
  .footer-note { text-align:center; color:#3a4060; font-size:11px; margin-top:14px; }

  /* ── Toast notification ── */
  #toast {
    position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-120%);
    z-index:999; min-width:260px; max-width:380px; width:90%;
    background:#1a2236; border:1px solid #2a3a5a;
    border-radius:16px; padding:14px 16px;
    box-shadow:0 8px 32px rgba(0,0,0,.55);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
    opacity:0; pointer-events:none;
  }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .toast-action { font-size:14px; font-weight:700; margin-bottom:10px; color:var(--text); }
  .toast-action span { margin-right:6px; }
  .toast-rows { display:flex; flex-direction:column; gap:6px; }
  .toast-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .toast-row-left { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); }
  .toast-delta { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .toast-mini-bar { flex:1; height:5px; border-radius:3px; background:#11141d; overflow:hidden; min-width:40px; }
  .toast-mini-fill { height:100%; border-radius:3px; transition:width .4s ease; }
  .toast-up   { color:var(--good); }
  .toast-dn   { color:var(--bad); }
</style>
</head>
<body>

<div id="toast">
  <div class="toast-action" id="toastTitle"></div>
  <div class="toast-rows" id="toastRows"></div>
</div>

<header>
  <h1>🛡️ Body Army</h1>
  <p>Type anything you do or put on/in your body — see what happens inside.</p>
</header>

<div class="wrap">

  <!-- COL 1: body image + overall scores -->
  <div class="panel">
    <div class="panel-title">Inside the body</div>
    <div class="bodyWrap" id="body">
      <img src="body.png?v=3" alt="human body with organs" />
      <div id="bodyFlash"></div>
    </div>
    <div class="score-row" style="margin-top:14px">
      <div class="score-block">
        <div class="score-label">🛡️ Body Defence</div>
        <div class="score-bar"><span id="bodyScoreBar" style="width:60%"></span></div>
      </div>
      <div class="score-num" id="bodyScoreVal">60</div>
    </div>
    <div class="score-row" style="margin-top:10px">
      <div class="score-block">
        <div class="score-label">🧠 Brain Health</div>
        <div class="score-bar"><span id="brainScoreBar" style="width:55%"></span></div>
      </div>
      <div class="score-num" id="brainScoreVal">55</div>
    </div>
  </div>

  <!-- COL 2: military strength tabs -->
  <div class="panel">
    <div class="tabs">
      <button class="tab-btn active" id="tab-body-btn" onclick="showTab('body')">🛡️ Body Defence</button>
      <button class="tab-btn"        id="tab-brain-btn" onclick="showTab('brain')">🧠 Brain</button>
    </div>

    <div id="tab-body">
      <div class="units" id="bodyUnits"></div>
    </div>
    <div id="tab-brain" style="display:none">
      <div class="units" id="brainUnits"></div>
    </div>
  </div>

  <!-- COL 3: input + log -->
  <div class="panel">
    <div class="panel-title">What did you do?</div>
    <div class="inputRow">
      <input id="inp" placeholder="e.g. drank kefir, ran 5k, read a book…" autocomplete="off" />
      <button id="go">Log it</button>
    </div>
    <div class="chips" id="chips"></div>

    <div class="panel-title" style="margin-top:18px">Battle report</div>
    <div class="log" id="log"></div>
    <div class="footer-note">Scientifically accurate • body defence + brain health</div>
  </div>

</div>

<script>
const clamp = v => Math.max(0, Math.min(100, v));

    emoji:'☕',
    msg:'Caffeine blocks adenosine (tiredness) and temporarily boosts dopamine and focus.',
    sci:'Caffeine is an adenosine receptor antagonist. Increases prefrontal dopamine release for ~3-5 hours.',
    fx:{ inflam:+3, neutro:+2, prefrontal:+6, dopamine:+5, amygdala:-3 } },

  { k:['isolated','lonely','alone','isolation'],
    emoji:'🫂',
    msg:'Loneliness activates the amygdala\'s threat response and significantly reduces serotonin and BDNF.',
    sci:'Chronic loneliness upregulates inflammatory genes and reduces hippocampal BDNF expression.',
    fx:{ serotonin:-10, dopamine:-7, amygdala:-10, bdnf:-7, inflam:-8 } },
];

// ─── UI helpers ───────────────────────────────────────────────────────────────
function buildUnits(arr, containerId){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  arr.forEach(u => {
    el.innerHTML += `
      <div class="unit" id="unit-${u.id}">
        <div class="unit-head">
          <div class="unit-left">
            <span class="unit-emoji">${u.emoji}</span>
            <div><div class="unit-name">${u.name}</div><div class="unit-desc">${u.desc}</div></div>
          </div>
          <div class="unit-val" id="uv-${u.id}">${Math.round(u.val)}</div>
        </div>
        <div class="unit-bar"><span id="ub-${u.id}" style="width:${u.val}%;background:${u.color}"></span></div>
      </div>`;
  });
}

function updateUnit(id, val){
  const v = clamp(val);
  document.getElementById('uv-'+id).textContent = Math.round(v);
  document.getElementById('ub-'+id).style.width = v+'%';
}

function flashUnit(id, good){
  const el = document.getElementById('unit-'+id);
  if(!el) return;
  el.style.background = good ? 'rgba(70,211,154,.15)' : 'rgba(255,107,107,.12)';
  setTimeout(()=>{ el.style.background=''; }, 550);
}

function avgScore(arr){
  return Math.round(arr.reduce((s,u)=>s+clamp(u.val),0)/arr.length);
}

function renderScores(){
  const bs = avgScore(BODY_UNITS);
  const br = avgScore(BRAIN_UNITS);
  document.getElementById('bodyScoreVal').textContent = bs;
  document.getElementById('bodyScoreBar').style.width = bs+'%';
  document.getElementById('bodyScoreBar').style.background =
    bs>65?'linear-gradient(90deg,#2fa372,#46d39a)':bs>40?'linear-gradient(90deg,#b45309,#fbbf24)':'linear-gradient(90deg,#991b1b,#ff6b6b)';

  document.getElementById('brainScoreVal').textContent = br;
  document.getElementById('brainScoreBar').style.width = br+'%';
  document.getElementById('brainScoreBar').style.background =
    br>65?'linear-gradient(90deg,#4338ca,#818cf8)':br>40?'linear-gradient(90deg,#b45309,#fbbf24)':'linear-gradient(90deg,#991b1b,#ff6b6b)';
}

function flashBody(good){
  const f = document.getElementById('bodyFlash');
  f.style.background = good ? 'rgba(70,211,154,.28)' : 'rgba(255,107,107,.28)';
  f.style.opacity = 1;
  setTimeout(()=>{ f.style.opacity=0; }, 420);
}

function showTab(tab){
  document.getElementById('tab-body').style.display   = tab==='body'  ? '' : 'none';
  document.getElementById('tab-brain').style.display  = tab==='brain' ? '' : 'none';
  document.getElementById('tab-body-btn').classList.toggle('active',  tab==='body');
  document.getElementById('tab-brain-btn').classList.toggle('active', tab==='brain');
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(label, r, changedUnits){
  const toast = document.getElementById('toast');
  document.getElementById('toastTitle').innerHTML = `${r.emoji} <span>${label}</span>`;

  const rows = document.getElementById('toastRows');
  rows.innerHTML = changedUnits.map(({u, delta}) => {
    const good = delta > 0;
    const sign = good ? '+' : '';
    return `
      <div class="toast-row">
        <div class="toast-row-left">
          <span>${u.emoji}</span>
          <span>${u.name}</span>
        </div>
        <div class="toast-mini-bar">
          <div class="toast-mini-fill" style="width:${clamp(u.val)}%;background:${u.color}"></div>
        </div>
        <div class="toast-delta ${good?'toast-up':'toast-dn'}">${sign}${delta}</div>
      </div>`;
  }).join('');

  clearTimeout(toastTimer);
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ─── Classify + apply ─────────────────────────────────────────────────────────
function classify(text){
  const t = text.toLowerCase();
  for(const r of RULES){
    if(r.k.some(w => t.includes(w))) return r;
  }
  return null;
}

function applyRule(label, r){
  const changes = [];
  const changedUnits = [];
  let netGood = 0;
  const hasBrain = Object.keys(r.fx).some(id => BRAIN_UNITS.find(u=>u.id===id));
  const hasBody  = Object.keys(r.fx).some(id => BODY_UNITS.find(u=>u.id===id));

  Object.entries(r.fx).forEach(([id, delta]) => {
    const u = unitMap[id]; if(!u) return;
    u.val = clamp(u.val + delta);
    updateUnit(id, u.val);
    flashUnit(id, delta > 0);
    netGood += delta;
    const sign = delta>0?'▲':'▼';
    changes.push(`<span class="${delta>0?'up':'dn'}">${sign} ${u.emoji} ${u.name}</span>`);
    changedUnits.push({ u, delta });
  });

  renderScores();
  flashBody(netGood >= 0);
  if(hasBrain && !hasBody) showTab('brain');
  else showTab('body');
  showToast(label, r, changedUnits);
  logLine(label, r, changes);
}

function logLine(label, r, changes){
  const log = document.getElementById('log');
  const d = document.createElement('div'); d.className='log-entry';
  d.innerHTML =
    `<div class="changes">${changes.join('<br>')}</div>`+
    `${r.emoji} <b>${label}</b>`+
    `<div class="sci">${r.msg}</div>`+
    `<div class="sci" style="color:#3a4878;margin-top:2px">${r.sci}</div>`;
  log.prepend(d);
}

function submit(text){
  text = text.trim(); if(!text) return;
  const r = classify(text);
  if(!r){
    const log = document.getElementById('log');
    const d = document.createElement('div'); d.className='log-entry';
    d.innerHTML=`🤔 <b>${text}</b><div class="sci">Not recognised — try food, drink, exercise, sleep, substances, social activity, or an injury.</div>`;
    log.prepend(d); return;
  }
  applyRule(text, r);
}

document.getElementById('go').onclick = ()=>{
  const i=document.getElementById('inp'); submit(i.value); i.value=''; i.focus();
};
document.getElementById('inp').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ submit(e.target.value); e.target.value=''; }
});

['drank kefir','went for a run','slept 8 hours','read a book','listened to music',
 'ate junk food','drank alcohol','scrolled social media','stressed out','smoked']
  .forEach(ex=>{
    const b=document.createElement('button'); b.textContent=ex;
    b.onclick=()=>submit(ex);
    document.getElementById('chips').appendChild(b);
  });

buildUnits(BODY_UNITS, 'bodyUnits');
buildUnits(BRAIN_UNITS, 'brainUnits');
renderScores();
</script>
