<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Body Army — Immune System Prototype</title>
<style>
  :root {
    --bg: #0e1016;
    --panel: #171a24;
    --panel-2: #1f2330;
    --text: #e7ebf3;
    --muted: #8b93a7;
    --good: #46d39a;
    --bad: #ff6b6b;
    --army: #5aa9ff;
    --line: #2a2f3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 70% -10%, #1a2030, var(--bg));
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 24px 20px 8px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 16px 20px 60px;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  .panel h2 { margin: 0 0 14px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  /* Body + battlefield */
  .body {
    position: relative;
    height: 320px;
    border-radius: 14px;
    background:
      radial-gradient(120px 160px at 50% 35%, rgba(90,169,255,.10), transparent),
      var(--panel-2);
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .figure {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 120px; filter: drop-shadow(0 0 18px rgba(90,169,255,.25));
  }
  .cell {
    position: absolute; width: 16px; height: 16px; border-radius: 50%;
    transition: transform .6s ease, opacity .4s ease;
  }
  .cell.army { background: radial-gradient(circle at 30% 30%, #bcdcff, var(--army)); box-shadow: 0 0 10px rgba(90,169,255,.7); }
  .cell.enemy { background: radial-gradient(circle at 30% 30%, #ffc2c2, var(--bad)); box-shadow: 0 0 10px rgba(255,107,107,.7); }

  /* Stats */
  .stat { margin-bottom: 14px; }
  .stat .row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .stat .row b { font-variant-numeric: tabular-nums; }
  .bar { height: 12px; border-radius: 8px; background: #11141d; overflow: hidden; border: 1px solid var(--line); }
  .bar > span { display: block; height: 100%; transition: width .5s ease; }
  .bar.army > span { background: linear-gradient(90deg, #3d7fd6, var(--army)); }
  .bar.enemy > span { background: linear-gradient(90deg, #c64b4b, var(--bad)); }
  .bar.health > span { background: linear-gradient(90deg, #2fa372, var(--good)); }

  /* Actions */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button.act {
    text-align: left; cursor: pointer; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 12px; font-size: 14px;
    transition: transform .08s ease, border-color .2s;
  }
  button.act:hover { border-color:#3a4a66; transform: translateY(-1px); }
  button.act:active { transform: translateY(0); }
  button.act .emoji { font-size: 20px; margin-right: 6px; }
  button.act .eff { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  button.act.good { border-left: 3px solid var(--good); }
  button.act.bad  { border-left: 3px solid var(--bad); }

  .log { margin-top: 6px; max-height: 150px; overflow:auto; font-size: 13px; }
  .log div { padding: 6px 8px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .log div b { color: var(--text); }

  .flash { transition: background .3s; }
  .footer-note { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }
</style>
</head>
<body>
  <header>
    <h1>🛡️ Body Army</h1>
    <p>Log what you do in real life — watch the battle inside your body.</p>
  </header>

  <div class="wrap">
    <!-- LEFT: the body battlefield -->
    <div class="panel">
      <h2>Inside the body</h2>
      <div class="body" id="body">
        <div class="figure">🧍</div>
      </div>

      <div style="margin-top:18px">
        <div class="stat">
          <div class="row"><span>🛡️ Army strength</span><b id="armyVal">50</b></div>
          <div class="bar army"><span id="armyBar" style="width:50%"></span></div>
        </div>
        <div class="stat">
          <div class="row"><span>🦠 Invaders</span><b id="enemyVal">10</b></div>
          <div class="bar enemy"><span id="enemyBar" style="width:10%"></span></div>
        </div>
        <div class="stat">
          <div class="row"><span>❤️ Overall health</span><b id="healthVal">80</b></div>
          <div class="bar health"><span id="healthBar" style="width:80%"></span></div>
        </div>
      </div>
    </div>

    <!-- RIGHT: actions + log -->
    <div class="panel">
      <h2>What did you do?</h2>
      <div class="actions" id="actions"></div>

      <h2 style="margin-top:20px">Battle log</h2>
      <div class="log" id="log"></div>
      <div class="footer-note">Prototype • each action ticks the simulation one step</div>
    </div>
  </div>

<script>
// ---- Game state ----
const state = { army: 50, enemy: 10, health: 80 };

// ---- Actions: the real-life thing -> what it does inside the body ----
const ACTIONS = [
  { id:'kefir',    emoji:'🥛', name:'Drank kefir',     type:'good', army:+12, enemy:-3,  health:+2, msg:'Good bacteria reinforce the gut. New troops recruited!' },
  { id:'sleep',    emoji:'😴', name:'Slept 8 hours',   type:'good', army:+8,  enemy:-5,  health:+6, msg:'Troops rested and healed overnight.' },
  { id:'exercise', emoji:'🏃', name:'Exercised',       type:'good', army:+6,  enemy:-2,  health:+4, msg:'Circulation up — soldiers patrol faster.' },
  { id:'vitc',     emoji:'🍊', name:'Vitamin C',       type:'good', army:+5,  enemy:-4,  health:+2, msg:'Antioxidants shield the front line.' },
  { id:'water',    emoji:'💧', name:'Stayed hydrated',  type:'good', army:+3,  enemy:-1,  health:+3, msg:'Supply lines flowing.' },
  { id:'junk',     emoji:'🍔', name:'Ate junk food',   type:'bad',  army:-4,  enemy:+10, health:-4, msg:'Sugar feeds the invaders. Enemy reinforcements!' },
  { id:'stress',   emoji:'😣', name:'Stressed out',    type:'bad',  army:-7,  enemy:+5,  health:-5, msg:'Cortisol exhausts the troops.' },
  { id:'nosleep',  emoji:'🌙', name:'Stayed up late',  type:'bad',  army:-9,  enemy:+6,  health:-6, msg:'No reinforcements arrived. Lines thin out.' },
];

const clamp = v => Math.max(0, Math.min(100, v));

// ---- Render ----
function setBar(id, val){ document.getElementById(id+'Bar').style.width = clamp(val)+'%'; document.getElementById(id+'Val').textContent = Math.round(val); }
function render(){ setBar('army',state.army); setBar('enemy',state.enemy); setBar('health',state.health); renderCells(); }

function renderCells(){
  const body = document.getElementById('body');
  body.querySelectorAll('.cell').forEach(c=>c.remove());
  const armyN = Math.round(state.army/10);
  const enemyN = Math.round(state.enemy/10);
  for(let i=0;i<armyN;i++) spawnCell(body,'army');
  for(let i=0;i<enemyN;i++) spawnCell(body,'enemy');
}
function spawnCell(body,kind){
  const el=document.createElement('div'); el.className='cell '+kind;
  el.style.left=(10+Math.random()*80)+'%'; el.style.top=(10+Math.random()*80)+'%';
  el.style.opacity=0; body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity=1; });
}

function logLine(a){
  const log=document.getElementById('log');
  const d=document.createElement('div');
  d.innerHTML = `${a.emoji} <b>${a.name}</b> — ${a.msg}`;
  log.prepend(d);
}

function flashBody(type){
  const body=document.getElementById('body');
  body.classList.add('flash');
  body.style.background = type==='good'
    ? 'radial-gradient(120px 160px at 50% 35%, rgba(70,211,154,.18), transparent), #1f2330'
    : 'radial-gradient(120px 160px at 50% 35%, rgba(255,107,107,.18), transparent), #1f2330';
  setTimeout(()=>{ body.style.background=''; }, 350);
}

// ---- Apply an action ----
function doAction(a){
  state.army = clamp(state.army + a.army);
  state.enemy = clamp(state.enemy + a.enemy);
  // health drifts toward (army - enemy) balance each tick
  state.health = clamp(state.health + a.health + (state.army - state.enemy)/40);
  flashBody(a.type);
  logLine(a);
  render();
}

// ---- Build the action buttons ----
const actionsEl = document.getElementById('actions');
ACTIONS.forEach(a=>{
  const b=document.createElement('button');
  b.className='act '+a.type;
  b.innerHTML=`<span class="emoji">${a.emoji}</span>${a.name}
    <span class="eff">🛡️ ${a.army>0?'+':''}${a.army} · 🦠 ${a.enemy>0?'+':''}${a.enemy}</span>`;
  b.onclick=()=>doAction(a);
  actionsEl.appendChild(b);
});

render();
</script>
</body>
</html>
