<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Body Army</title>
<style>
  :root {
    --bg:#0e1016; --panel:#171a24; --panel-2:#1f2330; --text:#e7ebf3;
    --muted:#8b93a7; --good:#46d39a; --bad:#ff6b6b; --army:#5aa9ff; --line:#2a2f3d;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%, #1a2030, var(--bg));
    color:var(--text); min-height:100vh; }

  header { padding:22px 20px 4px; text-align:center; position:relative; }
  header h1 { font-size:24px; letter-spacing:.4px; }
  header p  { margin-top:5px; color:var(--muted); font-size:13px; }
  #historyBtn {
    position:absolute; right:20px; top:22px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  #historyBtn:hover { border-color:#3a4a66; }

  .wrap { max-width:1160px; margin:0 auto; padding:14px 16px 60px;
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; align-items:start; }
  @media(max-width:900px){ .wrap{ grid-template-columns:1fr 1fr; } }
  @media(max-width:560px){ .wrap{ grid-template-columns:1fr; } }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .panel-title { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:12px; }

  /* ── Body image ── */
  .bodyWrap { position:relative; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); background:var(--bg); height:500px; }
  .bodyWrap img { position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; object-position:center top; }
  #bodyFlash { position:absolute; inset:0; pointer-events:none; opacity:0;
    border-radius:12px; transition:opacity .1s; z-index:3; }

  /* SVG organ overlay */
  #organSvg { position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:2; }
  .org { opacity:0; transition:opacity .9s ease; }

  .score-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px; }
  .score-block { flex:1; }
  .score-label { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .score-bar { height:7px; border-radius:5px; background:#11141d; overflow:hidden; border:1px solid var(--line); }
  .score-bar span { display:block; height:100%; transition:width .5s, background .5s; border-radius:5px; }
  .score-num { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* ── Tabs ── */
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn { flex:1; padding:8px 6px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); cursor:pointer; font-size:13px;
    font-weight:600; transition:all .15s; }
  .tab-btn.active { background:#1e2d4a; color:var(--army); border-color:#2a4a7a; }

  /* ── Units ── */
  .units { display:flex; flex-direction:column; gap:9px; }
  .unit { background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; transition:background .4s; }
  .unit-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .unit-left { display:flex; align-items:center; gap:8px; }
  .unit-emoji { font-size:17px; line-height:1; }
  .unit-name  { font-size:13px; font-weight:600; }
  .unit-desc  { font-size:11px; color:var(--muted); margin-top:1px; }
  .unit-val   { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:26px; text-align:right; }
  .unit-bar   { height:7px; border-radius:5px; background:#11141d; overflow:hidden; border:1px solid var(--line); }
  .unit-bar span { display:block; height:100%; transition:width .5s; border-radius:5px; }

  /* ── Input + log ── */
  .inputRow { display:flex; gap:8px; }
  .inputRow input { flex:1; background:var(--panel-2); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; color:var(--text); font-size:15px; }
  .inputRow input:focus { outline:none; border-color:#3a4a66; }
  .inputRow button { background:linear-gradient(90deg,#3d7fd6,var(--army)); border:none;
    color:#fff; font-weight:600; padding:0 16px; border-radius:12px; cursor:pointer; font-size:15px; }
  .chips { margin-top:10px; display:flex; flex-wrap:wrap; gap:7px; }
  .chips button { background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:6px 11px; font-size:12px; cursor:pointer; }
  .chips button:hover { color:var(--text); border-color:#3a4a66; }

  .log { margin-top:6px; max-height:300px; overflow:auto; font-size:13px; }
  .log-entry { padding:8px 6px; border-bottom:1px solid var(--line); color:var(--muted); }
  .log-entry b { color:var(--text); }
  .changes { float:right; font-size:11px; line-height:1.7; text-align:right; max-width:130px; margin-left:8px; }
  .up { color:var(--good); } .dn { color:var(--bad); }
  .sci { font-size:11px; color:#5a6480; margin-top:3px; }
  .footer-note { text-align:center; color:#3a4060; font-size:11px; margin-top:14px; }

  /* ── History page ── */
  #historyPage {
    display:none; position:fixed; inset:0; background:var(--bg);
    z-index:100; overflow-y:auto;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp { from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }
  .hist-header {
    display:flex; align-items:center; gap:14px;
    padding:20px 20px 12px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:2;
  }
  #histBackBtn {
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:8px 14px; font-size:14px; cursor:pointer;
  }
  .hist-header h2 { font-size:20px; }
  .hist-tabs { display:flex; gap:10px; padding:14px 20px 0; }
  .hist-tab {
    padding:10px 22px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); font-size:14px;
    font-weight:600; cursor:pointer; transition:all .15s;
  }
  .hist-tab.active { background:#1e2d4a; color:var(--army); border-color:#2a4a7a; }
  .hist-list { padding:14px 20px 40px; display:flex; flex-direction:column; gap:10px; max-width:700px; }
  .hist-empty { color:var(--muted); font-size:14px; padding:30px 0; text-align:center; }

  /* history card */
  .hcard {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; cursor:pointer; transition:border-color .15s;
  }
  .hcard:hover { border-color:#3a4a66; }
  .hcard-top {
    display:flex; align-items:center; gap:12px; padding:14px 16px;
  }
  .hcard-emoji { font-size:26px; flex-shrink:0; }
  .hcard-info { flex:1; min-width:0; }
  .hcard-name { font-size:15px; font-weight:700; }
  .hcard-time { font-size:12px; color:var(--muted); margin-top:2px; }
  .hcard-pills { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .hpill {
    font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px;
    background:var(--panel-2);
  }
  .hpill.up { color:var(--good); border:1px solid rgba(70,211,154,.3); }
  .hpill.dn { color:var(--bad);  border:1px solid rgba(255,107,107,.3); }
  .hcard-chevron { color:var(--muted); font-size:18px; flex-shrink:0; transition:transform .2s; }
  .hcard.open .hcard-chevron { transform:rotate(90deg); }

  /* expanded detail */
  .hcard-detail {
    display:none; border-top:1px solid var(--line); padding:14px 16px;
    background:var(--panel-2);
  }
  .hcard.open .hcard-detail { display:block; }
  .hd-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .hd-name { font-size:13px; flex:1; }
  .hd-bar { flex:2; height:7px; border-radius:5px; background:#11141d; overflow:hidden; }
  .hd-bar span { display:block; height:100%; border-radius:5px; }
  .hd-delta { font-size:13px; font-weight:700; min-width:34px; text-align:right; }
  .hd-sci { font-size:12px; color:#5a6480; margin-top:10px; line-height:1.5; }
  .hd-sci b { color:var(--muted); }

  /* ── Toast notification ── */
  #toast {
    position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-120%);
    z-index:999; min-width:260px; max-width:380px; width:90%;
    background:#1a2236; border:1px solid #2a3a5a;
    border-radius:16px; padding:14px 16px;
    box-shadow:0 8px 32px rgba(0,0,0,.55);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
    opacity:0; pointer-events:none;
  }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .toast-action { font-size:14px; font-weight:700; margin-bottom:10px; color:var(--text); }
  .toast-action span { margin-right:6px; }
  .toast-rows { display:flex; flex-direction:column; gap:6px; }
  .toast-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .toast-row-left { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); }
  .toast-delta { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .toast-mini-bar { flex:1; height:5px; border-radius:3px; background:#11141d; overflow:hidden; min-width:40px; }
  .toast-mini-fill { height:100%; border-radius:3px; transition:width .4s ease; }
  .toast-up   { color:var(--good); }
  .toast-dn   { color:var(--bad); }
</style>
</head>
<body>

<div id="toast">
  <div class="toast-action" id="toastTitle"></div>
  <div class="toast-rows" id="toastRows"></div>
</div>

<!-- History page (full-screen overlay) -->
<div id="historyPage">
  <div class="hist-header">
    <button id="histBackBtn" onclick="closeHistory()">← Back</button>
    <h2>📋 History</h2>
  </div>
  <div class="hist-tabs">
    <button class="hist-tab active" id="htab-food-btn"     onclick="showHistTab('food')">🍎 Food &amp; Drink</button>
    <button class="hist-tab"        id="htab-activity-btn" onclick="showHistTab('activity')">🏃 Activities</button>
  </div>
  <div class="hist-list" id="histList"></div>
</div>

<header>
  <h1>⚔️ Body Army</h1>
  <p>Tell your army what you did today — watch them fight for you!</p>
  <button id="historyBtn" onclick="openHistory()">📋 History</button>
</header>

<div class="wrap">

  <!-- COL 1: body image + overall scores -->
  <div class="panel">
    <div class="panel-title">🏰 Your Kingdom</div>
    <div class="bodyWrap" id="body">
      <img src="body.png?v=3" alt="human body with organs" />
      <div id="bodyFlash"></div>
      <!-- organ highlight overlay — viewBox matches cropped body.png (387×1536) -->
      <svg id="organSvg" viewBox="0 0 387 1536" preserveAspectRatio="xMidYMin meet">
        <ellipse id="org-brain"   class="org" cx="193" cy="82"  rx="68"  ry="78"/>
        <ellipse id="org-lung-l"  class="org" cx="127" cy="388" rx="58"  ry="88"/>
        <ellipse id="org-lung-r"  class="org" cx="258" cy="388" rx="58"  ry="88"/>
        <ellipse id="org-heart"   class="org" cx="183" cy="368" rx="36"  ry="44"/>
        <ellipse id="org-liver"   class="org" cx="258" cy="508" rx="62"  ry="52"/>
        <ellipse id="org-stomach" class="org" cx="153" cy="528" rx="48"  ry="52"/>
        <ellipse id="org-gut"     class="org" cx="193" cy="700" rx="96"  ry="108"/>
      </svg>
    </div>
    <div class="score-row" style="margin-top:14px">
      <div class="score-block">
        <div class="score-label">⚔️ Army Strength</div>
        <div class="score-bar"><span id="bodyScoreBar" style="width:60%"></span></div>
      </div>
      <div class="score-num" id="bodyScoreVal">60</div>
    </div>
    <div class="score-row" style="margin-top:10px">
      <div class="score-block">
        <div class="score-label">🧠 Brain Command</div>
        <div class="score-bar"><span id="brainScoreBar" style="width:55%"></span></div>
      </div>
      <div class="score-num" id="brainScoreVal">55</div>
    </div>
  </div>

  <!-- COL 2: military strength tabs -->
  <div class="panel">
    <div class="tabs">
      <button class="tab-btn active" id="tab-body-btn" onclick="showTab('body')">⚔️ Body Troops</button>
      <button class="tab-btn"        id="tab-brain-btn" onclick="showTab('brain')">🧠 Brain Command</button>
    </div>

    <div id="tab-body">
      <div class="units" id="bodyUnits"></div>
    </div>
    <div id="tab-brain" style="display:none">
      <div class="units" id="brainUnits"></div>
    </div>
  </div>

  <!-- COL 3: input + log -->
  <div class="panel">
    <div class="panel-title">🗡️ What did you do today?</div>
    <div class="inputRow">
      <input id="inp" placeholder="e.g. drank kefir, went for a run, read a book…" autocomplete="off" />
      <button id="go">Send!</button>
    </div>
    <div class="chips" id="chips"></div>

    <div class="panel-title" style="margin-top:18px">📜 Mission Report</div>
    <div class="log" id="log"></div>
    <div class="footer-note">⚔️ Every choice trains your army — make them strong!</div>
  </div>

</div>

<script>
const clamp = v => Math.max(0, Math.min(100, v));

// ─── Body defence units ────────────────────────────────────────────────────────
const BODY_UNITS = [
  { id:'gut',    emoji:'🦠', name:'Gut Microbiome',      desc:'Good bacteria — 70% of immunity lives here', val:60, color:'#4ade80' },
  { id:'neutro', emoji:'⚡', name:'Neutrophils',          desc:'First-responder white blood cells',           val:55, color:'#60a5fa' },
  { id:'tcell',  emoji:'🎯', name:'T-Cells',              desc:'Adaptive immunity — learn & destroy',         val:50, color:'#a78bfa' },
  { id:'nk',     emoji:'🗡️', name:'NK Cells',             desc:'Natural killers — hunt viruses & cancer',     val:50, color:'#fbbf24' },
  { id:'skin',   emoji:'🛡️', name:'Skin Barrier',         desc:'Physical perimeter defence',                  val:72, color:'#fb923c' },
  { id:'lung',   emoji:'🫁', name:'Lung Defence',         desc:'Mucociliary airway patrol',                   val:65, color:'#2dd4bf' },
  { id:'liver',  emoji:'🔧', name:'Liver',                desc:'Detox & toxin filtration',                    val:68, color:'#f59e0b' },
  { id:'inflam', emoji:'🌡️', name:'Inflammation Control', desc:'Low chronic inflammation = healthier',        val:65, color:'#f87171' },
];

// ─── Brain units ───────────────────────────────────────────────────────────────
const BRAIN_UNITS = [
  { id:'prefrontal',  emoji:'🧠', name:'Prefrontal Cortex', desc:'Focus, planning & self-control',             val:55, color:'#818cf8' },
  { id:'hippocampus', emoji:'💾', name:'Hippocampus',       desc:'Memory formation & learning',                val:55, color:'#34d399' },
  { id:'amygdala',    emoji:'😌', name:'Stress Regulation', desc:'Amygdala calm (higher = better regulated)',  val:60, color:'#f472b6' },
  { id:'dopamine',    emoji:'✨', name:'Dopamine System',   desc:'Motivation, drive & reward',                 val:55, color:'#fde68a' },
  { id:'serotonin',   emoji:'🌤️', name:'Serotonin',         desc:'Mood, wellbeing & emotional balance',        val:55, color:'#fdba74' },
  { id:'bdnf',        emoji:'🌱', name:'BDNF',              desc:'Brain growth factor — builds new connections',val:50, color:'#6ee7b7' },
];

const ALL_UNITS = [...BODY_UNITS, ...BRAIN_UNITS];
const unitMap = {};
ALL_UNITS.forEach(u => unitMap[u.id] = u);

// ─── Rules — keywords → effects on body + brain units ────────────────────────
const RULES = [
  // ── Good food & drink ──
  { k:['kefir','yogurt','yoghurt','kimchi','sauerkraut','kombucha','probiotic','miso'],
    type:'food', emoji:'🥛',
    msg:'New recruits join the Belly Battalion! Good bacteria soldiers pour into the tummy fortress!',
    sci:'Fun fact: 70% of your entire immune army lives in your gut — it\'s the biggest battlefield in your body!',
    fx:{ gut:+15, neutro:+4, inflam:+6, serotonin:+8, amygdala:+4 } },

  { k:['vegetable','veg','salad','broccoli','spinach','kale','greens','fruit','apple','berries','banana'],
    type:'food', emoji:'🥦',
    msg:'The Belly Battalion gets a feast! Fibre is like a power-up meal for your tummy soldiers.',
    sci:'Fun fact: When gut soldiers eat fibre they produce acids that help the Hunter Corps get stronger too!',
    fx:{ gut:+8, tcell:+5, inflam:+8, neutro:+3, bdnf:+5, hippocampus:+4 } },

  { k:['blueberr','berry','berries'],
    type:'food', emoji:'🫐',
    msg:'The Builders in your brain get new materials! Blueberries help them construct new paths!',
    sci:'Fun fact: The special blue colour in blueberries travels all the way to your brain to help Memory Keepers work better!',
    fx:{ bdnf:+12, hippocampus:+9, inflam:+7, gut:+4 } },

  { k:['orange','vitamin c','lemon','citrus','kiwi'],
    type:'food', emoji:'🍊',
    msg:'Vitamin C gives the Speed Squad armour! They charge into battle with 50× more power!',
    sci:'Fun fact: Speed Squad soldiers store up to 100 times more vitamin C than the blood around them — they love it!',
    fx:{ neutro:+10, skin:+5, inflam:+5, tcell:+3, dopamine:+5 } },

  { k:['dark chocolate','cacao','cocoa'],
    type:'food', emoji:'🍫',
    msg:'Dark chocolate gives the Builders and Sunshine Squad a big boost — the darker the better!',
    sci:'Fun fact: The special stuff in dark chocolate sends extra blood to the Memory Keepers so they can write faster!',
    fx:{ bdnf:+8, serotonin:+7, dopamine:+6, hippocampus:+5, inflam:+5 } },

  { k:['garlic','ginger','turmeric','honey'],
    type:'food', emoji:'🧄',
    msg:'Garlic and turmeric are like magic potions! They attack bad guys AND call in the Builders!',
    sci:'Fun fact: The yellow colour in turmeric is so powerful it can travel through your skull to help your brain soldiers!',
    fx:{ inflam:+14, neutro:+5, gut:+4, bdnf:+8, amygdala:+5 } },

  { k:['omega','fish oil','salmon','mackerel','sardine','walnut','flaxseed'],
    type:'food', emoji:'🐟',
    msg:'Omega-3 is brain armour! It builds stronger walls around every brain soldier so they fight better!',
    sci:'Fun fact: 40% of the wall around every brain cell is made from the stuff found in oily fish — they literally build your brain!',
    fx:{ inflam:+12, nk:+6, tcell:+4, bdnf:+10, prefrontal:+7, hippocampus:+7, serotonin:+6 } },

  { k:['water','hydrate','drank water'],
    type:'food', emoji:'💧',
    msg:'Water keeps the whole kingdom running! Without it the roads dry up and soldiers can\'t move!',
    sci:'Fun fact: Your brain is 75% water — even a tiny bit of thirst makes The Commander fuzzy and forgetful!',
    fx:{ skin:+5, lung:+6, liver:+5, inflam:+3, prefrontal:+5, hippocampus:+4, amygdala:+4 } },

  { k:['protein','chicken','turkey','eggs','fish','beans','tofu','meat','steak','lentil'],
    type:'food', emoji:'🍳',
    msg:'Protein is the army\'s building material! Soldiers use it to make weapons, armour AND happy signals!',
    sci:'Fun fact: Eggs and turkey make your Sunshine Squad! Your body turns the food into the happy signal itself!',
    fx:{ neutro:+5, tcell:+6, nk:+4, dopamine:+6, serotonin:+6 } },

  { k:['zinc','magnesium','supplement','multivitamin','vitamin b','b12'],
    type:'food', emoji:'💊',
    msg:'Vitamins and minerals are like weapons upgrades for your soldiers — everyone gets stronger!',
    sci:'Fun fact: Without zinc, your Hunter Corps can\'t even train properly. It\'s the most important kit in the army!',
    fx:{ tcell:+8, nk:+5, skin:+5, bdnf:+6, serotonin:+5, hippocampus:+5 } },

  { k:['green tea','matcha'],
    type:'food', emoji:'🍵',
    msg:'Green tea gives The Commander a superpower — calm and focused at the same time! No jitters!',
    sci:'Fun fact: Green tea has a special ingredient that makes you alert AND relaxed — like a chill superhero!',
    fx:{ prefrontal:+8, amygdala:+7, serotonin:+6, dopamine:+4, inflam:+5 } },

  // ── Lifestyle — positive ──
  { k:['sleep','slept','nap','8 hours','nine hours','ten hours'],
    type:'activity', emoji:'😴',
    msg:'The whole army rests, heals and gets stronger overnight! Memory Keepers file away everything you learned!',

         hippocampus:+14, prefrontal:+10, amygdala:+10, bdnf:+8, serotonin:+6 } },

  { k:['exercise','run','ran','gym','workout','walk','cycling','swim','jog','hiit','yoga','weights','lifting'],
    type:'activity', emoji:'🏃',
    msg:'Exercise sends the whole army into action mode! The Builders go crazy constructing new brain roads!',
    sci:'Fun fact: Just 30 minutes of running makes The Builders work 3× harder — it\'s the best thing you can do for your brain!',
    fx:{ nk:+10, neutro:+7, tcell:+6, lung:+6, inflam:+6,
         bdnf:+14, hippocampus:+10, prefrontal:+8, dopamine:+10, serotonin:+8, amygdala:+7 } },

  { k:['sun','sunlight','vitamin d','outside','fresh air','nature'],
    type:'activity', emoji:'☀️',
    msg:'Sunlight wakes up the Sunshine Squad instantly! They spread happiness across the whole kingdom!',
    sci:'Fun fact: Your skin makes vitamin D from sunlight like a solar panel — and vitamin D is a power-up for Hunter Corps!',
    fx:{ tcell:+9, nk:+6, inflam:+7, serotonin:+12, dopamine:+7, amygdala:+8, bdnf:+6 } },

  { k:['meditat','mindful','relax','breathing','calm','breathwork'],
    type:'activity', emoji:'🧘',

// ─── UI helpers ───────────────────────────────────────────────────────────────
function buildUnits(arr, containerId){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  arr.forEach(u => {
    el.innerHTML += `
      <div class="unit" id="unit-${u.id}">
        <div class="unit-head">
          <div class="unit-left">
            <span class="unit-emoji">${u.emoji}</span>
            <div><div class="unit-name">${u.name}</div><div class="unit-desc">${u.desc}</div></div>
          </div>
          <div class="unit-val" id="uv-${u.id}">${Math.round(u.val)}</div>
        </div>
        <div class="unit-bar"><span id="ub-${u.id}" style="width:${u.val}%;background:${u.color}"></span></div>
      </div>`;
  });
}

function updateUnit(id, val){
  const v = clamp(val);
  document.getElementById('uv-'+id).textContent = Math.round(v);
  document.getElementById('ub-'+id).style.width = v+'%';
}

function flashUnit(id, good){
  const el = document.getElementById('unit-'+id);
  if(!el) return;
  el.style.background = good ? 'rgba(70,211,154,.15)' : 'rgba(255,107,107,.12)';
  setTimeout(()=>{ el.style.background=''; }, 550);
}

function avgScore(arr){
  return Math.round(arr.reduce((s,u)=>s+clamp(u.val),0)/arr.length);
}

function renderScores(){
  const bs = avgScore(BODY_UNITS);
  const br = avgScore(BRAIN_UNITS);
  document.getElementById('bodyScoreVal').textContent = bs;
  document.getElementById('bodyScoreBar').style.width = bs+'%';
  document.getElementById('bodyScoreBar').style.background =
    bs>65?'linear-gradient(90deg,#2fa372,#46d39a)':bs>40?'linear-gradient(90deg,#b45309,#fbbf24)':'linear-gradient(90deg,#991b1b,#ff6b6b)';

  document.getElementById('brainScoreVal').textContent = br;
  document.getElementById('brainScoreBar').style.width = br+'%';
  document.getElementById('brainScoreBar').style.background =
    br>65?'linear-gradient(90deg,#4338ca,#818cf8)':br>40?'linear-gradient(90deg,#b45309,#fbbf24)':'linear-gradient(90deg,#991b1b,#ff6b6b)';
}

function flashBody(good){
  const f = document.getElementById('bodyFlash');
  f.style.background = good ? 'rgba(70,211,154,.28)' : 'rgba(255,107,107,.28)';
  f.style.opacity = 1;
  setTimeout(()=>{ f.style.opacity=0; }, 420);
}

function showTab(tab){
  document.getElementById('tab-body').style.display   = tab==='body'  ? '' : 'none';
  document.getElementById('tab-brain').style.display  = tab==='brain' ? '' : 'none';
  document.getElementById('tab-body-btn').classList.toggle('active',  tab==='body');
  document.getElementById('tab-brain-btn').classList.toggle('active', tab==='brain');
}

// ─── Organ flash ─────────────────────────────────────────────────────────────
// Maps each unit ID to the SVG organ element(s) it affects
const UNIT_ORGANS = {
  gut:         ['org-gut', 'org-stomach'],
  neutro:      ['org-heart'],
  tcell:       ['org-gut'],
  nk:          ['org-liver'],
  skin:        [],
  lung:        ['org-lung-l', 'org-lung-r'],
  liver:       ['org-liver'],
  inflam:      ['org-gut', 'org-stomach', 'org-liver'],
  prefrontal:  ['org-brain'],
  hippocampus: ['org-brain'],
  amygdala:    ['org-brain'],
  dopamine:    ['org-brain'],
  serotonin:   ['org-brain', 'org-gut'],
  bdnf:        ['org-brain'],
};

const orgTimers = {};

function flashOrgans(unitId, val) {
  const orgIds = UNIT_ORGANS[unitId] || [];
  // Color based on current health of the unit after the change
  const color = val >= 65 ? '#46d39a' : val >= 40 ? '#fbbf24' : '#ff6b6b';
  orgIds.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    // Cancel any fade-out in progress so the new flash wins
    clearTimeout(orgTimers[id]);
    el.style.transition = 'none';
    el.style.fill = color;
    el.style.opacity = '0.45';
    // Fade back out after 1.2 s
    orgTimers[id] = setTimeout(() => {
      el.style.transition = 'opacity 1s ease';
      el.style.opacity = '0';
    }, 1200);
  });
}

// ─── History storage ──────────────────────────────────────────────────────────
const history = [];   // { label, r, changedUnits, time }
let currentHistTab = 'food';

function openHistory(){
  document.getElementById('historyPage').style.display = 'block';
  renderHistList();
}
function closeHistory(){
  document.getElementById('historyPage').style.display = 'none';
}

function showHistTab(tab){
  currentHistTab = tab;
  document.getElementById('htab-food-btn').classList.toggle('active', tab==='food');
  document.getElementById('htab-activity-btn').classList.toggle('active', tab==='activity');
  renderHistList();
}

function renderHistList(){
  const list = document.getElementById('histList');
  const entries = history.filter(e => e.r.type === currentHistTab).reverse();
  if(!entries.length){
    list.innerHTML = `<div class="hist-empty">Nothing logged here yet.</div>`;
    return;
  }
  list.innerHTML = entries.map((e,i) => {
    const pills = e.changedUnits.map(({u,delta}) =>
      `<span class="hpill ${delta>0?'up':'dn'}">${delta>0?'▲':'▼'} ${u.emoji} ${u.name}</span>`
    ).join('');
    const detail = e.changedUnits.map(({u,delta}) => `
      <div class="hd-row">
        <div class="hd-name">${u.emoji} ${u.name}</div>
        <div class="hd-bar"><span style="width:${clamp(u.val)}%;background:${u.color}"></span></div>
        <div class="hd-delta ${delta>0?'up':'dn'}">${delta>0?'+':''}${delta}</div>
      </div>`).join('');
    return `
      <div class="hcard" id="hcard-${i}" onclick="toggleHcard(${i})">
        <div class="hcard-top">
          <div class="hcard-emoji">${e.r.emoji}</div>
          <div class="hcard-info">
            <div class="hcard-name">${e.label}</div>
            <div class="hcard-time">${e.time}</div>
            <div class="hcard-pills">${pills}</div>
          </div>
          <div class="hcard-chevron">›</div>
        </div>
        <div class="hcard-detail">
          ${detail}
          <div class="hd-sci"><b>What happened:</b> ${e.r.msg}</div>
          <div class="hd-sci"><b>The science:</b> ${e.r.sci}</div>
        </div>
      </div>`;
  }).join('');
}

function toggleHcard(i){
  const el = document.getElementById('hcard-'+i);
  el.classList.toggle('open');
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(label, r, changedUnits){
  const toast = document.getElementById('toast');
  document.getElementById('toastTitle').innerHTML = `${r.emoji} <span>${label}</span>`;

  const rows = document.getElementById('toastRows');
  rows.innerHTML = changedUnits.map(({u, delta}) => {
    const good = delta > 0;
    const sign = good ? '+' : '';
    return `
      <div class="toast-row">
        <div class="toast-row-left">
          <span>${u.emoji}</span>
          <span>${u.name}</span>
        </div>
        <div class="toast-mini-bar">
          <div class="toast-mini-fill" style="width:${clamp(u.val)}%;background:${u.color}"></div>
        </div>
        <div class="toast-delta ${good?'toast-up':'toast-dn'}">${sign}${delta}</div>
      </div>`;
  }).join('');

  clearTimeout(toastTimer);
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ─── Classify + apply ─────────────────────────────────────────────────────────
function classify(text){
  const t = text.toLowerCase();
  for(const r of RULES){
    if(r.k.some(w => t.includes(w))) return r;
  }
  return null;
}

function applyRule(label, r){
  const changes = [];
  const changedUnits = [];
  let netGood = 0;
  const hasBrain = Object.keys(r.fx).some(id => BRAIN_UNITS.find(u=>u.id===id));
  const hasBody  = Object.keys(r.fx).some(id => BODY_UNITS.find(u=>u.id===id));

  Object.entries(r.fx).forEach(([id, delta]) => {
    const u = unitMap[id]; if(!u) return;
    u.val = clamp(u.val + delta);
    updateUnit(id, u.val);
    flashUnit(id, delta > 0);
    flashOrgans(id, u.val);
    netGood += delta;
    const sign = delta>0?'▲':'▼';
    changes.push(`<span class="${delta>0?'up':'dn'}">${sign} ${u.emoji} ${u.name}</span>`);
    changedUnits.push({ u, delta });
  });

  renderScores();
  flashBody(netGood >= 0);
  if(hasBrain && !hasBody) showTab('brain');
  else showTab('body');
  showToast(label, r, changedUnits);
  logLine(label, r, changes);
  // Save to history
  const now = new Date();
  const time = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) +
               ' · ' + now.toLocaleDateString([], {day:'numeric',month:'short'});
  history.push({ label, r, changedUnits, time });
}

function logLine(label, r, changes){
  const log = document.getElementById('log');
  const d = document.createElement('div'); d.className='log-entry';
  d.innerHTML =
    `<div class="changes">${changes.join('<br>')}</div>`+
    `${r.emoji} <b>${label}</b>`+
    `<div class="sci">${r.msg}</div>`+
    `<div class="sci" style="color:#3a4878;margin-top:2px">${r.sci}</div>`;
  log.prepend(d);
}

function submit(text){
  text = text.trim(); if(!text) return;
  const r = classify(text);
  if(!r){
    const log = document.getElementById('log');
    const d = document.createElement('div'); d.className='log-entry';
    d.innerHTML=`🤔 <b>${text}</b><div class="sci">Not recognised — try food, drink, exercise, sleep, substances, social activity, or an injury.</div>`;
    log.prepend(d); return;
  }
  applyRule(text, r);
}

document.getElementById('go').onclick = ()=>{
  const i=document.getElementById('inp'); submit(i.value); i.value=''; i.focus();
};
document.getElementById('inp').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ submit(e.target.value); e.target.value=''; }
