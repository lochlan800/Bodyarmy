<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Body Army — what happens in your body</title>
<style>
  :root {
    --bg:#0e1016; --panel:#171a24; --panel-2:#1f2330; --text:#e7ebf3;
    --muted:#8b93a7; --good:#46d39a; --bad:#ff6b6b; --army:#5aa9ff; --line:#2a2f3d;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%, #1a2030, var(--bg)); color:var(--text); min-height:100vh; }
  header { padding:24px 20px 6px; text-align:center; }
  header h1 { margin:0; font-size:26px; letter-spacing:.5px; }
  header p { margin:6px 0 0; color:var(--muted); font-size:14px; }
  .wrap { max-width:980px; margin:0 auto; padding:16px 20px 60px;
    display:grid; grid-template-columns:1.1fr 1fr; gap:20px; }
  @media (max-width:820px){ .wrap{ grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .panel h2 { margin:0 0 14px; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }

  /* Real anatomy image body */
  .body { position:relative; height:480px; border-radius:14px; overflow:hidden;
    border:1px solid var(--line);
    background:var(--bg); }
  .body img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center top; display:block; }
  /* flash overlay */
  #bodyFlash { position:absolute; inset:0; pointer-events:none; opacity:0; border-radius:14px;
    transition:opacity .1s ease; z-index:3; }

  @keyframes pulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.18);} }

  .stat { margin-bottom:14px; }
  .stat .row { display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; }
  .stat .row b { font-variant-numeric:tabular-nums; }
  .bar { height:12px; border-radius:8px; background:#11141d; overflow:hidden; border:1px solid var(--line); }
  .bar > span { display:block; height:100%; transition:width .5s ease; }
  .bar.army > span { background:linear-gradient(90deg,#3d7fd6,var(--army)); }
  .bar.enemy > span { background:linear-gradient(90deg,#c64b4b,var(--bad)); }
  .bar.health > span { background:linear-gradient(90deg,#2fa372,var(--good)); }

  .inputRow { display:flex; gap:8px; }
  .inputRow input { flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; color:var(--text); font-size:15px; }
  .inputRow input:focus { outline:none; border-color:#3a4a66; }
  .inputRow button { background:linear-gradient(90deg,#3d7fd6,var(--army)); border:none; color:#fff;
    font-weight:600; padding:0 18px; border-radius:12px; cursor:pointer; font-size:15px; }
  .chips { margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:7px 12px; font-size:13px; cursor:pointer; }
  .chips button:hover { color:var(--text); border-color:#3a4a66; }

  .log { margin-top:6px; max-height:240px; overflow:auto; font-size:13px; }
  .log div { padding:8px; border-bottom:1px solid var(--line); color:var(--muted); }
  .log div b { color:var(--text); }
  .log .delta { float:right; font-variant-numeric:tabular-nums; font-size:12px; }
  .log .up { color:var(--good); } .log .down { color:var(--bad); }
  .footer-note { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }
</style>
</head>
<body>
  <header>
    <h1>🛡️ Body Army</h1>
    <p>Type anything you do or put on/in your body — see what happens inside.</p>
  </header>

  <div class="wrap">
    <div class="panel">
      <h2>Inside the body</h2>
      <div class="body" id="body">
        <img src="body.png" alt="human body with organs" />
        <div id="bodyFlash"></div>
      </div>
      <div style="margin-top:18px">
        <div class="stat"><div class="row"><span>🛡️ Army strength</span><b id="armyVal">50</b></div>
          <div class="bar army"><span id="armyBar" style="width:50%"></span></div></div>
        <div class="stat"><div class="row"><span>🦠 Invaders</span><b id="enemyVal">10</b></div>
          <div class="bar enemy"><span id="enemyBar" style="width:10%"></span></div></div>
        <div class="stat"><div class="row"><span>❤️ Overall health</span><b id="healthVal">80</b></div>
          <div class="bar health"><span id="healthBar" style="width:80%"></span></div></div>
      </div>
    </div>

    <div class="panel">
      <h2>What did you do?</h2>
      <div class="inputRow">
        <input id="inp" placeholder="e.g. drank kefir, ate pizza, went for a run..." autocomplete="off" />
        <button id="go">Do it</button>
      </div>
      <div class="chips" id="chips"></div>

      <h2 style="margin-top:20px">What happened</h2>
      <div class="log" id="log"></div>
      <div class="footer-note">Prototype • understands food, drink, exercise, sleep, substances, injuries & more</div>
    </div>
  </div>

<script>
const state = { army:50, enemy:10, health:80 };
const clamp = v => Math.max(0, Math.min(100, v));

// Each entry: keywords -> effect on the body.
// army = immune strength, enemy = invaders/pathogens, health = overall.
const RULES = [
  // --- Gut / good foods ---
  { k:['kefir','yogurt','yoghurt','kimchi','sauerkraut','kombucha','probiotic','miso'], emoji:'🥛',
    army:+12, enemy:-3, health:+2, msg:'Good bacteria reinforce your gut. Fresh troops recruited!' },
  { k:['vegetable','veg','salad','broccoli','spinach','kale','greens','fruit','apple','berries','banana'], emoji:'🥦',
    army:+7, enemy:-3, health:+5, msg:'Fibre and nutrients fuel the army.' },
  { k:['orange','vitamin c','lemon','citrus','kiwi'], emoji:'🍊',
    army:+6, enemy:-4, health:+3, msg:'Vitamin C shields the front line.' },
  { k:['garlic','ginger','turmeric','honey'], emoji:'🧄',
    army:+5, enemy:-5, health:+2, msg:'Natural antimicrobials hit the invaders.' },
  { k:['water','hydrate','drank water'], emoji:'💧',
    army:+3, enemy:-1, health:+4, msg:'Supply lines flowing — everything works better hydrated.' },
  { k:['protein','chicken','eggs','fish','beans','tofu'], emoji:'🍳',
    army:+6, enemy:0, health:+4, msg:'Building blocks delivered — troops rebuilt.' },

  // --- Junk / harmful intake ---
  { k:['sugar','candy','sweets','soda','cola','chocolate','cake','donut'], emoji:'🍬',
    army:-3, enemy:+10, health:-4, msg:'Sugar feeds the invaders. Enemy reinforcements!' },
  { k:['junk','fast food','pizza','burger','fries','chips','crisps'], emoji:'🍔',
    army:-4, enemy:+9, health:-5, msg:'Greasy fuel — invaders move in, army slows.' },
  { k:['alcohol','beer','wine','vodka','whiskey','drunk','drinking'], emoji:'🍺',
    army:-8, enemy:+6, health:-7, msg:'Alcohol dulls the troops and lowers defences.' },
  { k:['smoke','cigarette','vape','nicotine','smoking'], emoji:'🚬',
    army:-9, enemy:+8, health:-8, msg:'Smoke damages the lungs — front-line guards choke.' },
  { k:['coffee','caffeine','energy drink'], emoji:'☕',
    army:+1, enemy:+1, health:-1, msg:'Quick alertness, but jittery troops — small cost.' },

  // --- Rest / lifestyle ---
  { k:['sleep','slept','nap','rest','8 hours'], emoji:'😴',
    army:+9, enemy:-5, health:+6, msg:'Troops rested and healed overnight.' },
  { k:['no sleep','stayed up','late night','insomnia','tired'], emoji:'🌙',
    army:-9, enemy:+6, health:-6, msg:'No reinforcements arrived. Lines thin out.' },
  { k:['exercise','run','ran','gym','workout','walk','cycling','swim','jog'], emoji:'🏃',
    army:+7, enemy:-2, health:+5, msg:'Circulation up — soldiers patrol faster.' },
  { k:['stress','stressed','anxious','overwhelmed','panic'], emoji:'😣',
    army:-7, enemy:+5, health:-5, msg:'Cortisol exhausts the troops.' },
  { k:['sun','sunlight','vitamin d','outside','fresh air'], emoji:'☀️',
    army:+5, enemy:-2, health:+4, msg:'Vitamin D from sunlight boosts the commanders.' },
  { k:['meditate','meditation','relax','breathing','calm'], emoji:'🧘',
    army:+4, enemy:-2, health:+4, msg:'Stress drops — the army regroups calmly.' },

  // --- Hygiene / external ---
  { k:['wash hands','washed','soap','shower','clean','hygiene'], emoji:'🧼',
    army:+2, enemy:-8, health:+2, msg:'Pathogens washed away before they get in.' },
  { k:['sunscreen','sun cream','spf'], emoji:'🧴',
    army:0, enemy:-3, health:+2, msg:'Skin barrier protected from UV damage.' },
  { k:['cut','wound','scrape','graze','bleed'], emoji:'🩹',
    army:-2, enemy:+7, health:-3, msg:'Skin breached — invaders rush the wound. Army mobilises.' },
  { k:['cold','flu','sick','virus','infection','fever'], emoji:'🤧',
    army:-3, enemy:+14, health:-8, msg:'A pathogen invades! Full battle begins.' },
  { k:['vaccine','vaccinated','jab','flu shot'], emoji:'💉',
    army:+10, enemy:0, health:0, msg:'Army trained to recognise a specific enemy in advance.' },
  { k:['medicine','antibiotic','paracetamol','painkiller','vitamin'], emoji:'💊',
    army:+3, enemy:-6, health:+3, msg:'Backup arrives to help fight the invaders.' },
];

const clampFx = (cur,amt) => clamp(cur+amt);

function classify(text){
  const t = text.toLowerCase();
  for(const r of RULES){
    if(r.k.some(word => t.includes(word))) return r;
  }
  return null;
}

function setBar(id,val){ document.getElementById(id+'Bar').style.width=clamp(val)+'%';
  document.getElementById(id+'Val').textContent=Math.round(val); }
function render(){ setBar('army',state.army); setBar('enemy',state.enemy); setBar('health',state.health); renderCells(); }

function renderCells(){}
function flashBody(good){
  const f=document.getElementById('bodyFlash');
  f.style.background = good ? 'rgba(70,211,154,.30)' : 'rgba(255,107,107,.30)';
  f.style.opacity=1;
  setTimeout(()=>f.style.opacity=0, 400);
}
function logLine(label,r){
  const log=document.getElementById('log'); const d=document.createElement('div');
  const dir = (r.army+ -r.enemy + r.health) >= 0 ? 'up':'down';
  const sign = dir==='up'?'▲':'▼';
  d.innerHTML = `<span class="delta ${dir}">${sign} 🛡️${r.army>=0?'+':''}${r.army} 🦠${r.enemy>=0?'+':''}${r.enemy}</span>`
    + `${r.emoji} <b>${label}</b><br><span style="font-size:12px">${r.msg}</span>`;
  log.prepend(d);
}

function submit(text){
  text = text.trim(); if(!text) return;
  const r = classify(text);
  if(!r){
    const log=document.getElementById('log'); const d=document.createElement('div');
    d.innerHTML = `🤔 <b>${text}</b><br><span style="font-size:12px">The body shrugs — I don't recognise that one yet. Try food, drink, exercise, sleep, hygiene, or an injury.</span>`;
    log.prepend(d); return;
  }
  state.army=clampFx(state.army,r.army);
  state.enemy=clampFx(state.enemy,r.enemy);
  state.health=clamp(state.health + r.health + (state.army-state.enemy)/40);
  flashBody((r.army - r.enemy + r.health) >= 0);
  logLine(text,r); render();
}

document.getElementById('go').onclick=()=>{ const i=document.getElementById('inp'); submit(i.value); i.value=''; i.focus(); };
document.getElementById('inp').addEventListener('keydown',e=>{ if(e.key==='Enter'){ submit(e.target.value); e.target.value=''; } });

['drank kefir','ate pizza','went for a run','slept 8 hours','smoked a cigarette','got a cut','washed hands','stressed out']
  .forEach(ex=>{ const b=document.createElement('button'); b.textContent=ex; b.onclick=()=>submit(ex); document.getElementById('chips').appendChild(b); });

render();
</script>
</body>
</html>
